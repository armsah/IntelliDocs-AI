services:
  postgres:
    image: postgres:18-alpine
    container_name: intellidocs-postgres
    environment:
      POSTGRES_DB: intellidocs
      POSTGRES_USER: intellidocs
      POSTGRES_PASSWORD: intellidocs_dev
    ports:
      - "5433:5432"
    volumes:
      - intellidocs-postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U intellidocs -d intellidocs"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: intellidocs-azurite
    command:
      - azurite
      - --blobHost
      - 0.0.0.0
      - --queueHost
      - 0.0.0.0
      - --tableHost
      - 0.0.0.0
      - --location
      - /data
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - intellidocs-azurite-data:/data

volumes:
  intellidocs-postgres-data:
  intellidocs-azurite-data: